[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shoptrend_retail_merchandising_markdown_analytics"
version = "1.0.0"
description = "Retail Merchandising & Markdown Intelligence Data Warehouse: Sell-Through Rate (STR), promotional markdown elasticity, size/color curve stockouts, and GMROI."
readme = "README.md"
authors = [
    { name = "Abdussatar", email = "satarabdus692@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
